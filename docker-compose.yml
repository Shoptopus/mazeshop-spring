version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: shoptopus-postgres-sh
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - shoptopus_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    container_name: shoptopus-mailhog-sh
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  shoptopus_pg_data:
