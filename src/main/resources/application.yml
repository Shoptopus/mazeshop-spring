spring:
  application:
    name: shoptopus-spring
  datasource:
    main:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/shoptopus}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
    logs:
      url: ${DB_LOGS_URL:jdbc:postgresql://localhost:5432/shoptopus_logs}
      username: ${DB_LOGS_USERNAME:postgres}
      password: ${DB_LOGS_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

app:
  root-user:
    username: ${APP_ROOT_USER_USERNAME:superadmin@m.com}
  multistore:
    enabled: ${APP_MULTISTORE_ENABLED:false}
  jwt:
    secret: ${APP_JWT_SECRET:replace-with-strong-secret-32-chars-minimum}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:8081,http://localhost:8081,http://127.0.0.1:8082,http://localhost:8082}
  payment:
    stripe:
      public-key: ${STRIPE_SANDBOX_KEY:${STRIPE_KEY:}}
      secret-key: ${STRIPE_SANDBOX_SECRET_KEY:${STRIPE_SECRET_KEY:}}
    paypal:
      client-id: ${PAYPAL_SANDBOX_CLIENT_ID:}
      secret: ${PAYPAL_SANDBOX_SECRET:}
    amazon:
      merchant-id: ${AMAZON_SANDBOX_MERCHANT_ID:}
      store-id: ${AMAZON_SANDBOX_STORE_ID:}
      public-key-id: ${AMAZON_SANDBOX_PUBLIC_KEY_ID:}
      region: ${AMAZON_SANDBOX_REGION:}
  integrations:
    google-maps-api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyC02b2V5T14KWRLjhQb2hu6hGTKpYdOn7w}
    chatgpt-api-key: ${CHATGPT_API_KEY:}
  admin-ui:
    public-base-url: ${APP_ADMIN_UI_PUBLIC_BASE_URL:http://localhost:8080/studio}
  storefront:
    public-base-url: ${APP_STOREFRONT_PUBLIC_BASE_URL:http://localhost:8080}
    social-providers: ${APP_STOREFRONT_SOCIAL_PROVIDERS:google,facebook}
    currency: ${APP_STOREFRONT_CURRENCY:GBP}
  i18n:
    languages: ${APP_I18N_LANGUAGES:en}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:hello@thecaringdeveloper.com}
    from-name: ${MAIL_FROM_NAME:Shoptopus}
  media:
    storage-path: ${APP_MEDIA_STORAGE_PATH:${user.dir}/uploads/admin-media}
    public-base-url: ${APP_MEDIA_PUBLIC_BASE_URL:/media}
  snapshot:
    maintenance-enabled: ${APP_SNAPSHOT_MAINTENANCE_ENABLED:true}
    directory: ${APP_SNAPSHOT_DIRECTORY:${user.dir}/snapshots}
    retention: ${APP_SNAPSHOT_RETENTION:PT168H}
    schedule:
      fixed-delay: ${APP_SNAPSHOT_SCHEDULE_FIXED_DELAY:PT24H}
      initial-delay: ${APP_SNAPSHOT_SCHEDULE_INITIAL_DELAY:PT15M}
  dev:
    test-data:
      enabled: ${APP_DEV_TEST_DATA_ENABLED:false}
      seed-key: ${APP_DEV_TEST_DATA_SEED_KEY:mysql-dump-2026-04-04}
      dump-path: ${APP_DEV_TEST_DATA_DUMP_PATH:${user.dir}/../shoptopus/database/seeders/test-data/db-dump/2026-04-04T12:54:25.sql}
      images-path: ${APP_DEV_TEST_DATA_IMAGES_PATH:${user.dir}/../shoptopus/storage/app/test-data-images}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs
    disable-swagger-default-url: true
